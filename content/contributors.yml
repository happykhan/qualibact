# QualiBact contributor registry.
#
# Anyone who provided expert input (threshold values, dataset re-curation,
# species-specific rationale) on a (species, scheme) pair gets a record
# here so we can credit them on the species page and on the
# /contributors/ landing page.
#
# Entry shapes:
#
#   contributors[].id           — short kebab-case slug, used in attributions
#   contributors[].name         — display name
#   contributors[].affiliation  — institution
#   contributors[].country      — optional
#   contributors[].orcid        — optional ORCID iD (URL or 0000-... form)
#
#   funding[].id     — short slug, used in attributions
#   funding[].name   — funding source / project name
#   funding[].note   — optional context (programme, grant number, ...)
#   funding[].country — optional
#
#   attributions[]   — one entry per (species, scheme) acknowledged
#     species        — Genus_species
#     scheme         — qualibact-v1.0 | qualibact-v1.1 | REFSEQ-QC-v1
#     contributors   — list of contributor ids
#     funding        — list of funding ids (optional)
#     note           — free-text caveat shown alongside the names (optional)

